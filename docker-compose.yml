services:
  server:
    build: .
    environment:
      EURYPHOS_DB_PATH: /var/lib/euryphos/euryphos.db
      EURYPHOS_ADMIN_TOKEN: ${EURYPHOS_ADMIN_TOKEN:?Set EURYPHOS_ADMIN_TOKEN in .env}
      EURYPHOS_ENROLLMENT_TOKEN: ${EURYPHOS_ENROLLMENT_TOKEN:?Set EURYPHOS_ENROLLMENT_TOKEN in .env}
      EURYPHOS_LISTEN: :8080
      EURYPHOS_AUTO_MIGRATE: "true"
    ports:
      - "8080:8080"
    volumes:
      - euryphos-data:/var/lib/euryphos
    restart: unless-stopped

volumes:
  euryphos-data:
